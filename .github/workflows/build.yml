name: build-miner-image
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "r56-threejs commit to build"
        default: "527c82850d0f37fc441f981dc3831103393ea883"
      tag:
        description: "docker tag"
        default: "r56-527c828"
      repo:
        description: "submission repo (owner/name)"
        default: "karvachiik-lgtm/r56-threejs"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /opt/hostedtoolcache \
            /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - name: Checkout submission repo at frozen SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.sha }}
          path: src
      - name: Verify SHA matches the on-chain commitment
        run: |
          cd src && got=$(git rev-parse HEAD)
          echo "built from: $got"
          [ "$got" = "${{ github.event.inputs.sha }}" ] || { echo "SHA MISMATCH"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sn17-miner:${{ github.event.inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: df -h /
        if: always()
